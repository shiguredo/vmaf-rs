# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
exclude = { glob = ["target/**"] }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    entry = "cargo clippy --lib --features source-build -- -D warnings",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "cargo-test",
    name = "cargo test",
    entry = "cargo test --features source-build --test test_lib",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "cargo-pbt",
    name = "cargo test (pbt)",
    entry = "cargo test -p pbt --features source-build",
    language = "system",
    types = ["rust"],
    pass_filenames = false,
    priority = 21,
  },
]
