name: Prebuilt Smoke Test

# 初回リリース後に手動で起動し、prebuilt download 経路が機能することを検証する。
# 通常の CI では --features source-build でビルドするため、デフォルトの prebuilt
# 経路がリリースアセットを正しくダウンロード・展開できるかを確認する唯一のジョブ。
#
# 起動時に入力タグを指定し、指定されたリリースタグで checkout してビルドすることで
# build.rs の CARGO_PKG_VERSION がリリースアセットと一致する。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (e.g. 2026.0.0)"
        required: true
        type: string

concurrency:
  group: prebuilt-smoke-${{ inputs.tag }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  prebuilt-smoke:
    name: "Prebuilt Smoke (${{ inputs.tag }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag }}

      - run: rustup update stable

      - name: Build with prebuilt (default features, no source-build)
        run: cargo build --release

      - name: Verify source-build also works
        run: |
          cargo clean
          sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build nasm xxd
          cargo build --release --features source-build
