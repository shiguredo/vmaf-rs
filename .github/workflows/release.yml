name: Release

on:
  push:
    tags:
      - "*"

# deny-by-default の最小権限をトップレベルに置き、必要なジョブで明示的に昇格する
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    # gh release create は contents: write を必要とする
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Validate tag format and version match
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_VERSION=$(cargo metadata --format-version 1 | jq -r '.packages[0].version')

          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+-canary\.[0-9]+$ ]]; then
            BASE_VERSION="${VERSION%-canary.*}"
            if [[ "$BASE_VERSION" != "$PKG_VERSION" ]]; then
              echo "error: canary base version '${BASE_VERSION}' does not match Cargo.toml '${PKG_VERSION}'"
              exit 1
            fi
          elif [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "error: tag '${VERSION}' does not match Cargo.toml version '${PKG_VERSION}'"
              exit 1
            fi
          else
            echo "error: tag '${VERSION}' does not match expected format (YYYY.MM.PP or YYYY.MM.PP-canary.N)"
            exit 1
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --prerelease \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          else
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          fi

  build-prebuilt:
    name: "Build prebuilt (${{ matrix.target }})"
    needs: github-release
    # canary タグでは prebuilt URL とタグ名が一致しないためビルドしない
    if: ${{ !contains(needs.github-release.outputs.version, 'canary') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04_x86_64
            os: ubuntu-24.04
          - target: ubuntu-24.04_arm64
            os: ubuntu-24.04-arm
          - target: ubuntu-22.04_x86_64
            os: ubuntu-22.04
          - target: ubuntu-22.04_arm64
            os: ubuntu-22.04-arm
          - target: macos_arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup update stable

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential meson ninja-build xxd

      - name: Install NASM (x86_64 only)
        if: runner.os == 'Linux' && !endsWith(matrix.os, '-arm')
        run: sudo apt-get install -y nasm

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson
          command -v xxd

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR
        id: find_out_dir
        shell: bash
        run: |
          OUT_DIR=$(find target/release/build/shiguredo_vmaf-*/out -maxdepth 0 -type d 2>/dev/null | head -1)
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_OUTPUT

      - name: Create prebuilt archive
        shell: bash
        run: |
          OUT_DIR="${{ steps.find_out_dir.outputs.OUT_DIR }}"
          SRC_DIR="$OUT_DIR/build/vmaf/libvmaf/build/src"
          mkdir -p staging/lib
          cp "$SRC_DIR/libvmaf.a" staging/lib/
          cp "$OUT_DIR/bindings.rs" staging/
          tar czf vmaf-${{ matrix.target }}.tar.gz -C staging .

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum vmaf-${{ matrix.target }}.tar.gz > vmaf-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 vmaf-${{ matrix.target }}.tar.gz > vmaf-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.github-release.outputs.version }}" \
            vmaf-${{ matrix.target }}.tar.gz \
            vmaf-${{ matrix.target }}.tar.gz.sha256 \
            --clobber

  publish:
    needs: [github-release, build-prebuilt]
    # canary タグは crates.io に publish しない
    if: ${{ !contains(needs.github-release.outputs.version, 'canary') }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, build-prebuilt, publish]
    timeout-minutes: 20
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@145407fb88527b7068762db72480c1f55715e0b1 # main 2026-06-06
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
