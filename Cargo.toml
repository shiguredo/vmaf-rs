[package]
name = "shiguredo_vmaf"
version = "2026.0.0"
edition = "2024"
rust-version = "1.88"
description = "Rust bindings for libvmaf video quality metric"
readme = "README.md"
homepage = "https://github.com/shiguredo/vmaf-rs"
repository = "https://github.com/shiguredo/vmaf-rs"
license = "Apache-2.0"
build = "build.rs"
include = [
  "/LICENSE",
  "/LICENSE-THIRD-PARTY",
  "/README.md",
  "/build.rs",
  "/src/**/*"
]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies]
vmaf = { url = "https://github.com/Netflix/vmaf", version = "v3.1.0" }

[package.metadata.docs.rs]
features = []
default-features = false

[dependencies]

[dev-dependencies]
# コーデックラウンドトリップ + VMAF 統合テスト (tests/test_codec_vmaf/)
shiguredo_aom = "2026.1"
shiguredo_libvpx = "2026.1"
# I420 スケーリング等のピクセル処理 (tests/test_codec_vmaf/)
shiguredo_libyuv = "2026.1"

[build-dependencies]
bindgen = "0.72"
shiguredo_toml = "2026.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# H.264 / H.265 ハードウェア符号化 (macOS / Video Toolbox)
shiguredo_video_toolbox = "2026.1"

[features]
default = []
source-build = []
