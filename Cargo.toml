[package]
name = "shiguredo_vmaf"
version = "2026.1.0"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for libvmaf video quality metric"
readme = "README.md"
homepage = "https://github.com/shiguredo/vmaf-rs"
repository = "https://github.com/shiguredo/vmaf-rs"
license = "Apache-2.0"
build = "build.rs"
include = [
  "/LICENSE",
  "/LICENSE-THIRD-PARTY",
  "/README.md",
  "/build.rs",
  "/src/**/*"
]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.vmaf]
url = "https://github.com/Netflix/vmaf"
version = "v3.2.0"

[workspace]
members = ["pbt"]
exclude = ["fuzz"]

[dependencies]
# FFI エラーログ出力 (Drop 実装等)
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# コーデックラウンドトリップ + VMAF 統合テスト (tests/codec_vmaf/)
shiguredo_aom = "2026.2.0-canary.5"
shiguredo_libvpx = "2026.2.0-canary.1"
# I420 スケーリング等のピクセル処理 (tests/codec_vmaf/)
shiguredo_libyuv = "2026.2.0-canary.2"

[build-dependencies]
# libvmaf C ヘッダから Rust バインディングを生成する
bindgen = "0.72"
# build.rs で Cargo.toml のメタデータをパースする
shiguredo_toml = "2026.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# H.264 / H.265 ハードウェア符号化 (macOS / Video Toolbox)
shiguredo_video_toolbox = "2026.1"

[features]
source-build = []
